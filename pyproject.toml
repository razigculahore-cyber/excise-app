[project]
name = "excise-app"
version = "1.1.0"
description = "Excise Fee Estimator: vehicle registration, transfer and tax fee estimates with per-user logins."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "python-dotenv>=1.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest checks things

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake passwords in tests
