{# A password input with a show/hide toggle. Expects name, label, autocomplete, minlength, autofocus. #}
<label>{{ label }}
  <span class="pw-wrap">
    <input type="password" name="{{ name }}" autocomplete="{{ autocomplete }}"{% if minlength %} minlength="{{ minlength }}"{% endif %} required{% if autofocus %} autofocus{% endif %}>
    <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
  </span>
</label>
